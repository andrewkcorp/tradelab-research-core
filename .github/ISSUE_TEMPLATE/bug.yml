name: Reproducible bug
description: A synthetic reproduction of incorrect software behaviour
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Do not attach paid data, account details, secrets or private results. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, public revision and optional dependencies
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Exact command and invented input sufficient to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behaviour
      description: Include the methodology contract involved
    validations:
      required: true
