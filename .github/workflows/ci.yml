name: Synthetic core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Heuristic publication guard (not a full secret scanner)
        run: python tools/check_public_tree.py --tree .
      - name: Actual engine on synthetic bars
        run: python -m tradelab.synthetic_demo
      - name: Synthetic regression suite
        run: python -m unittest discover -s tests -t . -q
      - name: Dashboard reporter demo (fabricated metrics)
        run: python -m tradelab.research_demo --fast --runs-dir runs
      - name: Build installable package
        run: python -m pip wheel --no-deps --wheel-dir dist .
